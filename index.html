<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fripi - Second Hand en Ligne</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fdfbf7;
            color: #1b4d4f;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Background Animation Container */
        .clothes-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.05;
            pointer-events: none;
            overflow: hidden;
        }

        .cloth-icon {
            position: absolute;
            font-size: 3rem;
            color: #1b4d4f;
            animation: floatAround linear infinite;
        }

        @keyframes floatAround {
            0% { transform: translate(0, 100vh) rotate(0deg); }
            100% { transform: translate(calc(20vw - 10vw * var(--direction)), -10vh) rotate(360deg); }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            padding: 20px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-mark {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px auto;
            background: #e6f2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(27, 77, 79, 0.08);
        }

        .logo-mark svg {
            width: 40px;
            height: 40px;
            fill: #1b4d4f;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1b4d4f;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #d97743;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .badge-delivery {
            display: inline-block;
            background-color: #e6f2f2;
            color: #1b4d4f;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Gallery Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(27, 77, 79, 0.06);
            border: 1px solid rgba(27, 77, 79, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image-container {
            width: 100%;
            height: 320px;
            background-color: #f4f0eb;
            overflow: hidden;
            position: relative;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #d97743;
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1b4d4f;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .product-size {
            font-size: 0.9rem;
            color: #4a6b6d;
            background: #fdfbf7;
            padding: 4px 10px;
            border: 1px solid #e6f2f2;
            border-radius: 6px;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #d97743;
        }

        /* Instagram Link */
        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            text-decoration: none;
            color: #d97743;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .instagram-link:hover {
            color: #1b4d4f;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <!-- Moving Background Clothes -->
    <div class="clothes-bg">
        <div class="cloth-icon" style="--direction: 1; left: 10%; animation-duration: 12s; animation-delay: 0s;">👗</div>
        <div class="cloth-icon" style="--direction: -1; left: 30%; animation-duration: 15s; animation-delay: -3s;">🧥</div>
        <div class="cloth-icon" style="--direction: 1; left: 50%; animation-duration: 18s; animation-delay: -1s;">👖</div>
        <div class="cloth-icon" style="--direction: -1; left: 70%; animation-duration: 14s; animation-delay: -5s;">👕</div>
        <div class="cloth-icon" style="--direction: 1; left: 90%; animation-duration: 16s; animation-delay: -2s;">👔</div>
    </div>

    <div class="container">
        <header>
            <div class="logo-mark">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2c1.1 0 2 .9 2 2 0 .5-.2 1-.5 1.3l4.3 3.6c1.7 1.4 2.2 3.8 1.2 5.7-.9 1.7-2.7 2.7-4.6 2.7H7.6c-1.9 0-3.7-1-4.6-2.7-1-1.9-.5-4.3 1.2-5.7L8.5 5.3C8.2 5 8 4.5 8 4c0-1.1.9-2 2-2h2m0 2h-2v.5c0 .3.1.6.3.8l-4.2 3.5c-1.2 1-1.6 2.7-1 4.1.6 1.2 1.8 1.9 3.1 1.9h8.8c1.3 0 2.5-.7 3.1-1.9.6-1.4.2-3.1-1-4.1l-4.2-3.5c.2-.2.3-.5.3-.8V4z"/>
                </svg>
            </div>
            <h1>FRIPI</h1>
            <div class="tagline">Second Hand en Ligne</div>
            <div class="badge-delivery">📦 Paiement à la livraison (Tunisie)</div>
        </header>

        <!-- Product Gallery -->
        <div class="product-grid">
            <!-- Item 1 -->
            <div class="product-card">
                <div class="product-image-container">
                    <span class="product-tag">Disponible</span>
                    <img src="image_2d8023.jpg" alt="Blouse Rouge Col Perles">
                </div>
                <div class="product-info">
                    <div class="product-title">Blouse Élégante Col Perles</div>
                    <div class="product-meta">
                        <span class="product-size">Taille : M</span>
                        <span class="product-price">35 DT</span>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="product-card">
                <div class="product-image-container">
                    <span class="product-tag">Disponible</span>
                    <img src="image_2d8040.jpg" alt="Crop Top Kaki Rincé">
                </div>
                <div class="product-info">
                    <div class="product-title">Crop Top Kaki Ajustable</div>
                    <div class="product-meta">
                        <span class="product-size">Taille : M</span>
                        <span class="product-price">35 DT</span>
                    </div>
                </div>
            </div>
        </div>

        <a href="https://www.instagram.com/fripitn" target="_blank" rel="noopener noreferrer" class="instagram-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="24" height="24" fill="currentColor">
                <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
            </svg>
            <span>Commander sur Instagram @fripitn</span>
        </a>
    </div>

</body>
</html>
